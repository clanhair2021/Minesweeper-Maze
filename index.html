<!DOCTYPE html>
<html lang="ja" data-theme="monochrome">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINESWEEPER DUNGEON</title>
  <!-- レトロドットフォント読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CRT（ブラウン管）走査線オーバーレイ -->
  <div id="crt-overlay" class="crt-overlay"></div>

  <div class="game-container">
    
    <!-- ==================== ① メインメニュー画面 ==================== -->
    <section id="menu-screen" class="screen active">
      <div class="title-box">
        <h1 class="game-title">MINESWEEPER<br>DUNGEON</h1>
        <p class="sub-title">〜 爆破と探索のタワーパズル 〜</p>
      </div>

      <nav class="menu-nav">
        <button class="retro-btn start-btn" onclick="startMode('classic')">
          <span class="btn-text">1. CLASSIC MODE</span>
        </button>
        <button class="retro-btn start-btn" onclick="startMode('survival')">
          <span class="btn-text">2. SURVIVAL MODE</span>
        </button>
        <button class="retro-btn start-btn" onclick="startMode('dungeon')">
          <span class="btn-text">3. DUNGEON MODE</span>
        </button>
        <button class="retro-btn" onclick="toggleModal('shop-modal')">🛒 SHOP & SKILLS</button>
        <button class="retro-btn" onclick="toggleModal('settings-modal')">⚙️ SETTINGS</button>
      </nav>

      <p class="blink-text">- PRESS BUTTON TO START -</p>
    </section>

    <!-- ==================== ② ゲームプレイ画面 ==================== -->
    <section id="game-screen" class="screen">
      <!-- ヘッダーUI -->
      <header class="game-header">
        <div class="status-item"><span id="mode-label">MODE</span></div>
        <div class="status-item">FLOOR: <span id="floor-val">1F</span></div>
        <div class="status-item">HP: <span id="hp-val">10/10</span></div>
        <div class="status-item">COIN: <span id="coin-val">0</span></div>
      </header>

      <!-- メインボードエリア -->
      <main class="board-area">
        <div id="minesweeper-board" class="board-grid">
          <!-- JSでマス目（cell）を動的に生成 -->
        </div>
      </main>

      <!-- フッター操作・ログエリア -->
      <footer class="game-footer">
        <div class="action-bar">
          <button id="flag-btn" class="retro-btn small-btn">🚩 FLAG: OFF</button>
          <button id="skill-btn" class="retro-btn small-btn">✨ SKILL</button>
          <button class="retro-btn small-btn" onclick="backToMenu()">↩ MENU</button>
        </div>
        <div id="log-box" class="log-box">
          > 探索を開始した...
        </div>
      </footer>
    </section>

    <!-- ==================== モーダル（設定・ショップ） ==================== -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <h2>SETTINGS</h2>
        <div class="setting-item">
          <label>THEME COLOR:</label>
          <select id="theme-select" onchange="changeTheme(this.value)">
            <option value="monochrome">1. MONOCHROME CLASSIC</option>
            <option value="gb-green">2. GAMEBOY GREEN</option>
            <option value="amber">3. AMBER MONITOR</option>
            <option value="cyan">4. CYAN NEON</option>
            <option value="blood">5. DARK BLOOD</option>
          </select>
        </div>
        <button class="retro-btn" onclick="toggleModal('settings-modal')">CLOSE</button>
      </div>
    </div>

    <div id="shop-modal" class="modal">
      <div class="modal-content">
        <h2>SHOP</h2>
        <p>準備中 (COMING SOON)</p>
        <button class="retro-btn" onclick="toggleModal('shop-modal')">CLOSE</button>
      </div>
    </div>

  </div>

  <!-- 各モード用スクリプトの読み込み -->
  <script src="js/main.js"></script>
  <script src="js/classic.js"></script>
  <script src="js/survival.js"></script>
  <script src="js/dungeon.js"></script>
</body>
</html>
